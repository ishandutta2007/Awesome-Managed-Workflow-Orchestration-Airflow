<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C7B7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #9ca3af;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #f3f4f6;
    }
    .flow-line {
      stroke: #38bdf8;
      stroke-dasharray: 8 8;
      animation: dash 30s linear infinite;
      opacity: 0.35;
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.08); opacity: 1; }
    }
    .orbit-node {
      animation: orbit 12s linear infinite;
      transform-origin: 1000px 160px;
    }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="2" />

  <!-- Animated Dynamic DAG Background Elements (Kept in Background / High Opacity Controls) -->
  <g opacity="0.25">
    <path d="M 100 80 Q 250 160 400 80 T 700 80 T 1000 80" fill="none" class="flow-line" stroke-width="3" />
    <path d="M 150 240 Q 350 120 650 240 T 1050 240" fill="none" class="flow-line" stroke-width="3" />
    <circle cx="200" cy="120" r="40" fill="#38bdf8" opacity="0.15" />
    <circle cx="500" cy="220" r="60" fill="#818cf8" opacity="0.15" />
    <circle cx="850" cy="140" r="50" fill="#c084fc" opacity="0.15" />
  </g>

  <!-- Dynamic Orbiting DAG Nodes in Background -->
  <g class="orbit-node" opacity="0.4">
    <circle cx="1100" cy="160" r="6" fill="#38bdf8" />
    <circle cx="900" cy="160" r="4" fill="#c084fc" />
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 110)">
    <text x="0" y="0" class="title" filter="url(#glow)">Awesome Managed Airflow &amp; Workflow Orchestration</text>
    <text x="0" y="42" class="subtitle">Curated Guide to Managed Apache Airflow, DAG Platforms &amp; Modern Open-Source Orchestrators</text>

    <!-- Foreground Feature Pills -->
    <g transform="translate(0, 85)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="75" y="23" text-anchor="middle" class="pill-text">⚡ Apache Airflow</text>

      <!-- Pill 2 -->
      <rect x="165" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <text x="245" y="23" text-anchor="middle" class="pill-text">☁️ Managed Services</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <text x="422" y="23" text-anchor="middle" class="pill-text">🔄 DAG Orchestration</text>

      <!-- Pill 4 -->
      <rect x="520" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#00C7B7" stroke-width="1.5" />
      <text x="600" y="23" text-anchor="middle" class="pill-text">🚀 Open-Source Engines</text>
    </g>
  </g>
</svg>
